<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d2b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trail Navi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <header id="status" class="status idle">
    <div class="status-main" id="statusText">GPS off</div>
    <div class="status-sub" id="statusSub">Route: –</div>
  </header>

  <div id="legend" class="legend" hidden>
    <div class="legend-title">Slope</div>
    <div id="legendBar" class="legend-bar"></div>
    <div class="legend-scale"><span>0 %</span><span id="legendMid"></span><span id="legendMax"></span></div>
  </div>

  <nav class="controls">
    <button id="btnGps" class="primary">Start GPS</button>
    <button id="btnFollow" aria-pressed="true" title="Map follows your position">Follow</button>
    <button id="btnColor" aria-pressed="false" title="Colour tracks by slope">Slope</button>
    <button id="btnPanel">Menu</button>
  </nav>

  <section id="panel" class="panel" hidden>
    <h2>Offline maps</h2>
    <p class="hint">Downloads map tiles to the device in a corridor along all visible tracks and around the POIs. Best done on Wi-Fi.</p>

    <label>Map type
      <select id="dlLayer"></select>
    </label>
    <label>Zoom levels
      <select id="dlZoom">
        <option value="12-16">12–16 (overview, small)</option>
        <option value="12-17" selected>12–17 (recommended)</option>
        <option value="12-18">12–18 (detail, large)</option>
      </select>
    </label>
    <label>Corridor width
      <select id="dlBuffer">
        <option value="200">± 200 m</option>
        <option value="400" selected>± 400 m</option>
        <option value="1000">± 1 km</option>
      </select>
    </label>

    <p id="dlEstimate" class="mono">–</p>
    <progress id="dlProgress" max="1" value="0" hidden></progress>
    <p id="dlState" class="mono"></p>

    <div class="row">
      <button id="btnDownload" class="primary">Download</button>
      <button id="btnAbort" hidden>Cancel</button>
    </div>

    <h2>Settings</h2>
    <label>“On track” tolerance
      <select id="tolerance">
        <option value="15">15 m</option>
        <option value="25" selected>25 m</option>
        <option value="40">40 m</option>
        <option value="75">75 m</option>
      </select>
    </label>
    <label>Slope scale (red from this value)
      <select id="slopeMax">
        <option value="6">0–6 % (emphasises small slopes)</option>
        <option value="10" selected>0–10 % (recommended)</option>
        <option value="16">0–16 %</option>
      </select>
    </label>
    <label>Load custom GPX instead of default tracks
      <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml">
    </label>
    <div class="row">
      <button id="btnResetNetwork" hidden>Restore default tracks</button>
    </div>

    <p id="storage" class="mono"></p>
    <div class="row">
      <button id="btnSim">Start simulation</button>
      <button id="btnClear" class="danger">Delete offline maps</button>
    </div>
    <div class="row">
      <button id="btnClose">Close</button>
    </div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
